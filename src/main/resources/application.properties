spring.application.name=book-management

spring.sql.init.mode=never

spring.datascource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_POST}:${DATABASE_NAME}
spring.datascource.driver-class-name=org.postgresql.Driver
spring.datascource.usrename=${DATABASE_USRE}
spring.datascource.password=${DATABASE_PASSWORD}

mybatis.configuration.map-underscore-to-camel-case=true

